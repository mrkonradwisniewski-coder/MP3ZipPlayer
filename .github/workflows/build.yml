name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip MP3ZipPlayer-projekt.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: |
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n' > gradle.properties
          gradle assembleDebug
        working-directory: MP3ZipPlayer
      - uses: actions/upload-artifact@v4
        with: { name: MP3ZipPlayer-apk, path: MP3ZipPlayer/app/build/outputs/apk/debug/app-debug.apk }
